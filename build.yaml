targets:
  $default:
    builders:
      freezed:
        options:
          # Generate copyWith methods
          copyWith: true
          # Generate ==
          equal: true
          # Generate toString
          toString: true
          # Generate map/maybeMap
          map: true
          # Generate when/maybeWhen
          when: true
      json_serializable:
        options:
          # Map camelCase fields to snake_case JSON keys (Supabase convention)
          field_rename: snake
          # Throw error if JSON key doesn't exist
          disallow_unrecognized_keys: false
          # Include null fields in toJson
          include_if_null: false
          # Use checked conversions
          checked: true
          # Explicit toJson
          explicit_to_json: true
