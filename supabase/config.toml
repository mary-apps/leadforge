# Supabase Configuration

project_id = "YOUR_PROJECT_ID"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.leadforge.app://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = "YOUR_APPLE_CLIENT_ID"
secret = "YOUR_APPLE_SECRET"

# Edge Functions verify JWT internally via auth.getUser(),
# so disable gateway-level verification which rejects ES256 tokens.
[functions.scout]
verify_jwt = false

[functions.audit]
verify_jwt = false

[functions.build-demo]
verify_jwt = false

[functions.outreach]
verify_jwt = false

[functions.demo]
verify_jwt = false
