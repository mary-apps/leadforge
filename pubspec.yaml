name: leadforge
description: AI-powered lead generation app for freelancers and agencies
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # Backend & Auth
  supabase_flutter: ^2.0.0
  
  # Navigation
  go_router: ^14.0.0
  
  # UI & Animations
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.0
  confetti: ^0.7.0
  
  # Web & Content
  webview_flutter: ^4.4.0
  url_launcher: ^6.2.0
  
  # Monetization
  purchases_flutter: ^6.0.0
  
  # Utilities
  share_plus: ^7.0.0
  flutter_secure_storage: ^9.0.0
  
  # Serialization
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0
  
  # Internationalization
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/SFProDisplay-Semibold.otf
          weight: 600
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SFProText-Regular.otf
          weight: 400
        - asset: assets/fonts/SFProText-Semibold.otf
          weight: 600
    - family: SF Mono
      fonts:
        - asset: assets/fonts/SFMono-Medium.otf
          weight: 500
